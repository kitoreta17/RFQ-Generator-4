<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>RFQ Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f3f4f6;
  color:#111827
}

.wrap{
  max-width:1180px;
  margin:0 auto;
  padding:24px
}

.app{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:22px;
  align-items:start
}

.panel{
  background:#fff;
  border-radius:12px;
  padding:20px;
  box-shadow:0 2px 10px #0001
}

h1{
  margin:0 0 4px;
  font-size:24px
}

.muted{
  color:#6b7280;
  font-size:13px;
  margin-bottom:18px
}

label{
  display:block;
  font-weight:600;
  font-size:13px;
  margin:12px 0 5px
}

input,textarea,button{
  font:inherit
}

input,textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:7px;
  padding:10px;
  font-size:16px;
  background:#fff;
  color:#111827
}

input:focus,textarea:focus{
  outline:none;
  border-color:#6b7280;
  box-shadow:0 0 0 2px #0000000d
}

textarea{
  min-height:70px;
  resize:vertical
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.items{
  margin-top:14px
}

.item{
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:10px;
  margin-bottom:8px;
  background:#fafafa
}

.itemgrid{
  display:grid;
  grid-template-columns:65px 1fr 110px;
  gap:7px
}

.itemgrid2{
  display:grid;
  grid-template-columns:1fr 110px;
  gap:7px;
  margin-top:7px
}

.btn{
  border:0;
  border-radius:7px;
  padding:10px 13px;
  cursor:pointer;
  font-weight:700;
  min-height:42px;
  touch-action:manipulation
}

.btn:hover{
  opacity:.9
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed
}

.primary{
  background:#111827;
  color:#fff
}

.secondary{
  background:#e5e7eb;
  color:#111827
}

.success{
  background:#166534;
  color:#fff
}

.info-btn{
  background:#1d4ed8;
  color:#fff
}

.danger{
  background:#fee2e2;
  color:#991b1b
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px
}

.export-title{
  font-size:12px;
  font-weight:700;
  color:#6b7280;
  width:100%;
  margin-top:5px
}

.preview{
  background:#9ca3af;
  padding:25px;
  overflow:auto;
  min-width:0
}

.paper{
  background:#fff;
  width:210mm;
  min-width:210mm;
  height:297mm;
  min-height:297mm;
  margin:0 auto;
  padding:16mm 15mm;
  color:#000;
  box-shadow:0 2px 10px #0003;
  overflow:hidden
}

.rfqtitle{
  text-align:center;
  font-size:18px;
  font-weight:700;
  margin-bottom:15px
}

.info{
  width:100%;
  border-collapse:collapse;
  margin-bottom:14px
}

.info td{
  padding:3px 2px;
  font-size:11px;
  vertical-align:top
}

.line{
  border-bottom:1px solid #000;
  min-height:15px;
  word-break:break-word
}


/* =====================================================
   QUOTATION TABLE
   ===================================================== */

.quote-table{
  width:100%;
  border-collapse:collapse;
  border-spacing:0;
  font-size:10px;
  table-layout:fixed;

  /* KEEP ORIGINAL OVERALL TABLE HEIGHT */
  height:216px;
}

.quote-table th,
.quote-table td{
  border-left:1px solid #000;
  border-right:1px solid #000;
  border-top:0;
  border-bottom:0;
  padding:5px;
  vertical-align:top;
}

.quote-table thead th{
  border-top:1px solid #000;
  border-bottom:1px solid #000;
  text-align:center;
  font-weight:700;
  height:27px;
}


/* =====================================================
   ITEM ROW
   ===================================================== */

.quote-table .item-row td{
  height:27px;
  padding:5px;
}


/* =====================================================
   BLANK SPACE ROW
   IMPORTANT:
   Use 4 separate cells instead of colspan="4"
   so the vertical column lines continue.
   ===================================================== */

.quote-table .space-row td{
  padding:0;
  border-top:0;
  border-bottom:0;
  height:auto;
}


/* =====================================================
   COLUMN WIDTHS
   ===================================================== */

.quote-table .qty{
  width:9%
}

.quote-table .desc{
  width:42%
}

.quote-table .amt{
  width:20%
}

.quote-table .terms{
  width:29%
}


/* Bottom border of entire quotation table */
.quote-table tbody tr:last-child td{
  border-bottom:1px solid #000
}


/* =====================================================
   REQUESTED BY
   ===================================================== */

.requested{
  margin-top:24px;
  font-size:11px
}

.reqline{
  margin-top:20px;
  border-bottom:1px solid #000;
  width:45%;
  padding-bottom:3px
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media(max-width:1100px){

  .app{
    grid-template-columns:340px 1fr;
    gap:15px
  }

  .wrap{
    padding:15px
  }

  .preview{
    padding:15px
  }

}

@media(max-width:900px){

  body{
    background:#f3f4f6
  }

  .wrap{
    padding:10px
  }

  .app{
    display:block
  }

  .panel{
    border-radius:10px;
    padding:15px;
    margin-bottom:12px
  }

  h1{
    font-size:22px
  }

  .muted{
    margin-bottom:14px
  }

  .row{
    grid-template-columns:1fr;
    gap:0
  }

  label{
    margin-top:12px
  }

  input,textarea{
    font-size:16px;
    padding:11px
  }

  .item{
    padding:9px
  }

  .itemgrid{
    grid-template-columns:60px 1fr;
    gap:7px
  }

  .itemgrid input:last-child{
    grid-column:1 / -1
  }

  .itemgrid2{
    grid-template-columns:1fr
  }

  .itemgrid2 .btn{
    width:100%
  }

  .actions{
    display:grid;
    grid-template-columns:1fr 1fr
  }

  .actions .export-title{
    grid-column:1 / -1
  }

  .actions .btn{
    width:100%
  }

  .preview{
    padding:10px;
    border-radius:8px;
    overflow-x:auto;
    overflow-y:hidden
  }

  .paper{
    margin:0 auto
  }

}

@media(max-width:480px){

  .wrap{
    padding:7px
  }

  .panel{
    padding:13px
  }

  h1{
    font-size:21px
  }

  .actions{
    grid-template-columns:1fr
  }

  .actions .export-title{
    grid-column:1
  }

  .preview{
    padding:6px
  }

}


/* =====================================================
   PRINT
   ===================================================== */

@media print{

  @page{
    size:A4 portrait;
    margin:0
  }

  html,body{
    width:210mm;
    height:297mm;
    margin:0;
    padding:0;
    background:#fff
  }

  .wrap{
    display:block;
    padding:0;
    margin:0;
    width:210mm
  }

  .app{
    display:block
  }

  .panel{
    display:none
  }

  .preview{
    padding:0;
    margin:0;
    background:#fff;
    overflow:visible
  }

  .paper{
    margin:0;
    width:210mm;
    min-width:210mm;
    height:297mm;
    min-height:297mm;
    box-shadow:none;
    overflow:hidden
  }

}

button{
  -webkit-tap-highlight-color:transparent
}

</style>
</head>

<body>

<div class="wrap">

<div class="app">

<section class="panel">

<h1>RFQ Generator</h1>

<div class="muted">
Based on your supplied A4 Request for Quotation Form.
</div>

<label>Company Name</label>
<input id="company" autocomplete="organization">

<label>Address</label>
<textarea id="address" autocomplete="street-address"></textarea>

<div class="row">

<div>
<label>Attention</label>
<input id="attention" autocomplete="name">
</div>

<div>
<label>Quote No.</label>
<input id="quote">
</div>

</div>

<div class="row">

<div>
<label>Date</label>
<input id="date" type="date">
</div>

<div>
<label>Requested By</label>
<input id="requested">
</div>

</div>

<div class="items">

<label>Quotation Items</label>

<div id="items"></div>

<button
  type="button"
  class="btn secondary"
  onclick="addItem()"
>
+ Add Item
</button>

</div>

<div class="actions">

<div class="export-title">
EXPORT / PRINT
</div>

<button
  type="button"
  id="pdfButton"
  class="btn success"
  onclick="savePDF(this)"
>
Save as PDF
</button>

<button
  type="button"
  id="jpegButton"
  class="btn info-btn"
  onclick="saveJPEG(this)"
>
Save as JPEG
</button>

<button
  type="button"
  class="btn primary"
  onclick="window.print()"
>
Print
</button>

<div class="export-title">
DRAFT
</div>

<button
  type="button"
  class="btn secondary"
  onclick="saveDraft()"
>
Save Draft
</button>

<button
  type="button"
  class="btn secondary"
  onclick="loadDraft()"
>
Load Draft
</button>

<button
  type="button"
  class="btn danger"
  onclick="clearForm()"
>
Clear
</button>

</div>

</section>


<section class="preview">

<div class="paper" id="paper">

<div class="rfqtitle">
REQUEST FOR QUOTATION FORM
</div>


<table class="info">

<tr>

<td style="width:16%">
<b>COMPANY NAME:</b>
</td>

<td>
<div class="line" id="pcompany"></div>
</td>

<td style="width:9%">
<b>DATE:</b>
</td>

<td style="width:20%">
<div class="line" id="pdate"></div>
</td>

</tr>


<tr>

<td>
<b>ADDRESS:</b>
</td>

<td>
<div class="line" id="paddress"></div>
</td>

<td>
<b>QUOTE NO.</b>
</td>

<td>
<div class="line" id="pquote"></div>
</td>

</tr>


<tr>

<td></td>

<td>
<div class="line" id="paddress2"></div>
</td>

<td></td>

<td></td>

</tr>


<tr>

<td>
<b>ATTENTION:</b>
</td>

<td colspan="3">
<div class="line" id="pattention"></div>
</td>

</tr>

</table>


<table class="quote-table">

<thead>

<tr>

<th class="qty">
QTY
</th>

<th class="desc">
DESCRIPTION/PARTICULAR
</th>

<th class="amt">
AMOUNT
</th>

<th class="terms">
TERMS/REMARKS
</th>

</tr>

</thead>

<tbody id="previewItems"></tbody>

</table>


<div class="requested">

<b>Requested By:</b>

<div
  class="reqline"
  id="prequested"
></div>

</div>

</div>

</section>

</div>

</div>


<script>

const $ = id =>
  document.getElementById(id);

let items = [];


function esc(v){

  return String(v ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

}


function isIOS(){

  return /iPad|iPhone|iPod/.test(
    navigator.userAgent
  )
  ||
  (
    navigator.platform === 'MacIntel'
    &&
    navigator.maxTouchPoints > 1
  );

}


function addItem(
  data={
    qty:'',
    desc:'',
    amount:'',
    terms:''
  }
){

  items.push({

    qty:data.qty ?? '',
    desc:data.desc ?? '',
    amount:data.amount ?? '',
    terms:data.terms ?? ''

  });

  renderItems();

}


function removeItem(i){

  items.splice(i,1);

  renderItems();

}


function renderItems(){

  const box =
    $('items');

  box.innerHTML = '';


  items.forEach((x,i)=>{

    const d =
      document.createElement('div');

    d.className =
      'item';


    d.innerHTML = `

      <div class="itemgrid">

        <input
          type="text"
          inputmode="numeric"
          placeholder="Qty"
          value="${esc(x.qty)}"
          data-i="${i}"
          data-k="qty"
        >

        <input
          type="text"
          placeholder="Description / Particular"
          value="${esc(x.desc)}"
          data-i="${i}"
          data-k="desc"
        >

        <input
          type="text"
          inputmode="decimal"
          placeholder="Amount"
          value="${esc(x.amount)}"
          data-i="${i}"
          data-k="amount"
        >

      </div>


      <div class="itemgrid2">

        <input
          type="text"
          placeholder="Terms / Remarks"
          value="${esc(x.terms)}"
          data-i="${i}"
          data-k="terms"
        >

        <button
          type="button"
          class="btn danger"
          onclick="removeItem(${i})"
        >
          Remove
        </button>

      </div>

    `;


    box.appendChild(d);

  });


  box.querySelectorAll('input')
    .forEach(el=>{

      el.addEventListener(
        'input',
        ()=>{

          items[
            Number(el.dataset.i)
          ][el.dataset.k] =
            el.value;

          updatePreview();

        }
      );

    });


  updatePreview();

}


/* =====================================================
   UPDATE PREVIEW
   ===================================================== */

function updatePreview(){

  $('pcompany').textContent =
    $('company').value;


  const lines =
    $('address').value.split('\n');


  $('paddress').textContent =
    lines[0] || '';


  $('paddress2').textContent =
    lines.slice(1).join(' ') || '';


  $('pattention').textContent =
    $('attention').value;


  $('pquote').textContent =
    $('quote').value;


  const dt =
    $('date').value;


  $('pdate').textContent =
    dt
      ? new Date(
          dt + 'T00:00:00'
        ).toLocaleDateString(
          'en-PH',
          {
            year:'numeric',
            month:'long',
            day:'numeric'
          }
        )
      : '';


  $('prequested').textContent =
    $('requested').value;


  const tb =
    $('previewItems');


  tb.innerHTML = '';


  /*
    KEEP THE SAME OVERALL TABLE SIZE

    Original table:
    8 rows × 27px = 216px
  */

  const TOTAL_HEIGHT = 216;

  const ITEM_HEIGHT = 27;


  /*
    Number of item sections.

    Every item gets:
      1 item row
      1 blank space row

    The blank space is divided equally
    between all items.
  */

  const count =
    Math.max(items.length,1);


  const totalItemHeight =
    count * ITEM_HEIGHT;


  const spaceHeight =
    Math.max(
      0,
      (
        TOTAL_HEIGHT -
        totalItemHeight
      ) / count
    );


  /*
    Create item + blank space.

    IMPORTANT:
    The blank space now contains FOUR
    separate <td> cells.

    This keeps the vertical column lines
    continuous from the header to the
    bottom of the table.
  */

  items.forEach(x=>{

    /* ITEM ROW */

    const itemRow =
      document.createElement('tr');

    itemRow.className =
      'item-row';

    itemRow.innerHTML = `

      <td>
        ${esc(x.qty || '')}
      </td>

      <td>
        ${esc(x.desc || '')
          .replace(/\n/g,'<br>')}
      </td>

      <td>
        ${esc(x.amount || '')}
      </td>

      <td>
        ${esc(x.terms || '')
          .replace(/\n/g,'<br>')}
      </td>

    `;

    tb.appendChild(itemRow);


    /* BLANK SPACE ROW */

    const spaceRow =
      document.createElement('tr');

    spaceRow.className =
      'space-row';

    spaceRow.innerHTML = `

      <td
        style="
          height:${spaceHeight}px;
          padding:0;
        "
      ></td>

      <td
        style="
          height:${spaceHeight}px;
          padding:0;
        "
      ></td>

      <td
        style="
          height:${spaceHeight}px;
          padding:0;
        "
      ></td>

      <td
        style="
          height:${spaceHeight}px;
          padding:0;
        "
      ></td>

    `;

    tb.appendChild(spaceRow);

  });


  /*
    If there are no items,
    keep the entire 216px blank area.
  */

  if(items.length === 0){

    const emptyRow =
      document.createElement('tr');

    emptyRow.className =
      'space-row';

    emptyRow.innerHTML = `

      <td
        style="
          height:${TOTAL_HEIGHT}px;
          padding:0;
        "
      ></td>

      <td
        style="
          height:${TOTAL_HEIGHT}px;
          padding:0;
        "
      ></td>

      <td
        style="
          height:${TOTAL_HEIGHT}px;
          padding:0;
        "
      ></td>

      <td
        style="
          height:${TOTAL_HEIGHT}px;
          padding:0;
        "
      ></td>

    `;

    tb.appendChild(emptyRow);

  }

}


/* =====================================================
   FORM INPUT LISTENERS
   ===================================================== */

[
  'company',
  'address',
  'attention',
  'quote',
  'date',
  'requested'
].forEach(id=>{

  $(id).addEventListener(
    'input',
    updatePreview
  );

});


/* =====================================================
   SAVE DRAFT
   ===================================================== */

function saveDraft(){

  const draft = {

    company:
      $('company').value,

    address:
      $('address').value,

    attention:
      $('attention').value,

    quote:
      $('quote').value,

    date:
      $('date').value,

    requested:
      $('requested').value,

    items:
      items

  };


  try{

    localStorage.setItem(
      'rfqDraft',
      JSON.stringify(draft)
    );


    alert(
      'Draft saved in this browser.'
    );


  }catch(error){

    alert(
      'Unable to save draft on this device.'
    );

  }

}


/* =====================================================
   LOAD DRAFT
   ===================================================== */

function loadDraft(){

  try{

    const raw =
      localStorage.getItem(
        'rfqDraft'
      );


    if(!raw){

      alert(
        'No saved draft found.'
      );

      return;

    }


    const x =
      JSON.parse(raw);


    [
      'company',
      'address',
      'attention',
      'quote',
      'date',
      'requested'
    ].forEach(k=>{

      $(k).value =
        x[k] || '';

    });


    items =
      Array.isArray(x.items)
        ? x.items
        : [];


    renderItems();


  }catch(e){

    console.error(e);


    alert(
      'Unable to load saved draft.'
    );

  }

}


/* =====================================================
   CLEAR
   ===================================================== */

function clearForm(){

  if(
    !confirm(
      'Clear this RFQ?'
    )
  )
    return;


  [
    'company',
    'address',
    'attention',
    'quote',
    'date',
    'requested'
  ].forEach(k=>{

    $(k).value = '';

  });


  items = [];


  addItem();

}


/* =====================================================
   FILE NAME
   ===================================================== */

function getFileName(
  extension
){

  let companyName =
    $('company')
      .value
      .trim();


  let quoteNo =
    $('quote')
      .value
      .trim();


  if(!companyName)
    companyName = 'RFQ';


  companyName =
    companyName.replace(
      /[^a-z0-9]+/gi,
      '_'
    );


  quoteNo =
    quoteNo.replace(
      /[^a-z0-9]+/gi,
      '_'
    );


  return quoteNo

    ? `${companyName}_${quoteNo}.${extension}`

    : `${companyName}_RFQ.${extension}`;

}


/* =====================================================
   SHARE FILE
   ===================================================== */

async function shareFile(
  blob,
  fileName,
  title
){

  try{

    const file =
      new File(
        [blob],
        fileName,
        {
          type:blob.type
        }
      );


    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({
        files:[file]
      })
    ){

      await navigator.share({

        files:[file],

        title:title,

        text:'RFQ Generator'

      });


      return true;

    }


    return false;


  }catch(error){

    if(
      error &&
      error.name === 'AbortError'
    )
      return true;


    console.error(
      'Share error:',
      error
    );


    return false;

  }

}


/* =====================================================
   SAVE PDF
   ===================================================== */

async function savePDF(button){

  try{

    button.disabled = true;


    button.textContent =
      isIOS()
        ? 'Preparing PDF...'
        : 'Creating PDF...';


    const paper =
      $('paper');


    const canvas =
      await html2canvas(
        paper,
        {
          scale:2.5,
          useCORS:true,
          backgroundColor:'#ffffff',
          logging:false,
          width:paper.scrollWidth,
          height:paper.scrollHeight
        }
      );


    const imageData =
      canvas.toDataURL(
        'image/jpeg',
        0.95
      );


    const {jsPDF} =
      window.jspdf;


    const pdf =
      new jsPDF({
        orientation:'portrait',
        unit:'mm',
        format:'a4',
        compress:true
      });


    pdf.addImage(
      imageData,
      'JPEG',
      0,
      0,
      210,
      297,
      undefined,
      'FAST'
    );


    const pdfBlob =
      pdf.output('blob');


    const fileName =
      getFileName('pdf');


    if(isIOS()){

      button.textContent =
        'Opening Share...';


      const shared =
        await shareFile(
          pdfBlob,
          fileName,
          'RFQ PDF'
        );


      if(shared)
        return;

    }


    const url =
      URL.createObjectURL(
        pdfBlob
      );


    const link =
      document.createElement('a');


    link.href =
      url;


    link.download =
      fileName;

/* =====================================================
   SAVE JPEG
   ===================================================== */

async function saveJPEG(button){

  try{

    button.disabled = true;


    button.textContent =
      isIOS()
        ? 'Preparing Image...'
        : 'Creating JPEG...';


    const paper =
      $('paper');


    const canvas =
      await html2canvas(
        paper,
        {
          scale:3,
          useCORS:true,
          backgroundColor:'#ffffff',
          logging:false,
          width:paper.scrollWidth,
          height:paper.scrollHeight
        }
      );


    const blob =
      await new Promise(
        resolve=>{

          canvas.toBlob(
            resolve,
            'image/jpeg',
            0.95
          );

        }
      );


    if(!blob){

      throw new Error(
        'JPEG creation failed.'
      );

    }


    const fileName =
      getFileName('jpg');


    if(isIOS()){

      button.textContent =
        'Opening Share...';


      const shared =
        await shareFile(
          blob,
          fileName,
          'RFQ JPEG'
        );


      if(shared)
        return;

    }


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement('a');


    link.href =
      url;


    link.download =
      fileName;


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );


    setTimeout(
      ()=>{
        URL.revokeObjectURL(url);
      },
      2000
    );


  }catch(error){

    console.error(error);


    alert(
      'Unable to create JPEG. Please try again.'
    );


  }finally{

    button.disabled = false;


    button.textContent =
      'Save as JPEG';

  }

}
